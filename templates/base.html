<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GreenBasket{% endblock %} | Organic Grocery</title>
  <meta name="description" content="GreenBasket organic grocery retail prototype with data-driven insights.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold brand" href="{{ url_for('home') }}">🌿 GreenBasket</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navMain">
      <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <a class="nav-link" href="{{ url_for('home') }}#products">Shop products</a>
        <a class="nav-link" href="{{ url_for('admin_login') }}">Admin dashboard</a>
      </div>
    </div>
  </div>
</nav>
<main>{% block content %}{% endblock %}</main>
<footer class="footer mt-5 py-4">
  <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
    <span>🌱 GreenBasket — Data-Driven Organic Grocery Retail</span>
    <span class="text-secondary small">Academic prototype · Demo analytics data</span>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
